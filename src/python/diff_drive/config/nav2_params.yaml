# nav2_params.yaml
# Navigation stack for diff_drive_cpp on VMX.
# Used by navigation.launch.py.
#
# Quick-tune checklist
#  Robot: 445mm long × 390mm wide.  Court openings: 600mm.
#
#  1. footprint              — 445×390mm polygon in both global and local costmap.
#                             [[0.2225, 0.195], [0.2225, -0.195], [-0.2225, -0.195], [-0.2225, 0.195]]
#                             Update both if robot dimensions change.
#
#  2. inflation_radius       — how far costmap inflates outside the polygon edge.
#                             Hard constraint: gap_width/2 − robot_half_width
#                             = (0.300 − 0.195) = 0.105m maximum.
#                             Current: 0.08 (25mm planning margin in 600mm gaps).
#                             Increase for more clearance in open areas once narrow gaps work.
#
#  3. cost_scaling_factor    — how steeply cost drops with distance from obstacles.
#                             1.0 = gentle gradient (uses more of narrow corridor).
#                             3.0 = sharp gradient (planner hugs midpoints aggressively).
#                             Current: 1.0 (recommended for tight court).
#
#  4. desired_linear_vel     — autonomous cruise speed (m/s). Start conservative.
#                             Max hardware speed is 0.6273 m/s; 0.25 is safe.
#
#  5. xy_goal_tolerance      — how close the robot must get to the goal XY (m).
#  6. yaw_goal_tolerance     — how close the robot must match goal heading (rad).
#
#  7. Global costmap publish_frequency — 1 Hz is fine; raise to 2 if map seems stale.
#  8. Local costmap update_frequency   — 5 Hz default; Pi can handle this.

# AMCL: particle-filter localization in the saved map
# AMCL estimates where the robot is inside the pgm/yaml map.
# After launch, you MUST set the initial pose in RViz with "2D Pose Estimate"
# (click the toolbar button, then click+drag on the map in RViz).
# Without an initial pose AMCL has no starting point and Nav2 will not move.
amcl:
  ros__parameters:
    use_sim_time: false

    # Motion model noise — higher values = AMCL allows more uncertainty per move.
    # Increase if the robot slips a lot (odometry unreliable); decrease if AMCL
    # particles spread too widely and localization is jittery.
    alpha1: 0.2       # rotation noise from rotation
    alpha2: 0.2       # rotation noise from translation
    alpha3: 0.2       # translation noise from translation
    alpha4: 0.2       # translation noise from rotation
    alpha5: 0.2       # strafe noise (unused for diff drive, kept for completeness)

    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom

    # Particle filter bounds — more particles = more accurate, more CPU.
    max_particles: 2000   # reduce to 500 if Pi is struggling
    min_particles: 500

    # How much motion is required before updating.
    # 0.05 m / 0.05 rad keeps the pose estimate tight during slow corridor navigation.
    # (Reference wskills config used 0.05/0.05 and worked well in same court.)
    update_min_d: 0.0     # update on every scan — keeps map→odom TF fresh for Nav2 controller
    update_min_a: 0.0     # (non-zero values cause TF staleness at navigation start)

    resample_interval: 1
    transform_tolerance: 1.5

    # Laser model — likelihood_field is accurate without being compute-heavy.
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 3.0    # was 2.0 — wider search improves match in longer corridors
    laser_max_range: 12.0
    laser_min_range: 0.1
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    robot_model_type: nav2_amcl::DifferentialMotionModel

    # scan_topic: /scan (raw merged scan) — NOT /scan_filtered.
    # The confidence gate's motion filter blocks ALL scans when angular velocity exceeds
    # 0.75 rad/s, which happens during Nav2 turns and recovery spins. This causes AMCL
    # to stop publishing map→odom TF entirely while the robot rotates, crashing the
    # nav stack with TF extrapolation errors. AMCL is a particle filter that handles
    # noisy data — it does not need confidence-gate quality scans.
    scan_topic: scan
    map_topic: map

    # Broadcast a default initial pose at startup so AMCL immediately publishes
    # the map->odom TF.  Without this the costmaps time out waiting for the TF
    # and the navigation stack fails to activate.
    # Correct the pose in RViz with "2D Pose Estimate" once the stack is up.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    tf_broadcast: true
    save_pose_rate: 0.5

    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

# map_server: serves the pgm/yaml map to AMCL and the global costmap
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""    # set by navigation.launch.py via --ros-args

# bt_navigator: Behaviour Tree based action server
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered    # EKF-fused odometry, not raw /odom
    bt_loop_duration: 50             # ms per BT tick = 20 Hz; generous for Pi under nav load
    default_server_timeout: 120      # was 20 — allows time for recovery actions to complete
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# planner_server: global path planning
# NavFn planner: Dijkstra/A* on the global costmap. Simple, reliable, fast.
# Generates a global path from current pose to goal once per request.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0    # Hz — global path replanned at this rate
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5          # metres — how close to goal counts as success
      use_astar: false         # false = Dijkstra (safer); true = A* (faster)
      allow_unknown: true      # plan through unexplored space

# controller_server: local path following
# Regulated Pure Pursuit (RPP): robust diff-drive follower.
# Tracks the global path using a lookahead point and regulated linear velocity.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0          # Hz — Pi budget; raise to 10 if stable
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5      # ignored for diff drive (no lateral)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25      # ← tune: larger = robot stops farther from goal
      yaw_goal_tolerance: 3.14159  # ignore heading — robot stops at XY; heading handled by route server
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Speed
      desired_linear_vel: 0.12         # ← tune: cruise speed (m/s); start conservative
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      # Lookahead
      lookahead_dist: 0.6              # ← tune: larger = smoother but cuts corners more
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false

      # Rotation on the spot before driving
      # false = RPP follows the planned path immediately (drives forward out of
      # corners as the planner intended).  true = RPP ignores the path and first
      # spins in place toward the goal direction — which blocks when the robot is
      # near a wall and can't rotate.
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.4     # radians (~23°) — only used when use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.5   # rad/s — scaled for max_angular: 25
      allow_reversing: false

      # Regulated velocity scaling
      use_regulated_linear_velocity_scaling: true    # slow down on tight curves
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: false

      # Collision checking
      # Disabled: lookahead check fires immediately in tight spaces because the
      # local costmap's inscribed zone (0.205m) exceeds inflation_radius (0.08m).
      # Physical collision protection still comes from the costmap footprint check.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25

      # Misc
      transform_tolerance: 1.5          # scan pipeline adds ~400ms latency; needs >0.5s margin
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

# behavior_server: recovery behaviours
# Activated when the robot gets stuck: spin, back up, wait.
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

# waypoint_follower: execute a list of waypoints in sequence
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# velocity_smoother: post-processes cmd_vel before it reaches the robot
# nav2_bringup always loads this node.  Without config it defaults to CLOSED_LOOP
# mode which needs /odom — but ours is /odometry/filtered — and will silently
# limit output to zero.  Explicitly set OPEN_LOOP so it smooths kinematically
# without needing odometry feedback.
#
# nav2_bringup remaps internally:
#   controller_server → cmd_vel_nav → velocity_smoother → cmd_vel → diff_drive_node
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "CLOSED_LOOP"           # uses /odometry/filtered for velocity lag compensation
    max_velocity: [0.15, 0.0, 2.0]    # [vx, vy, vtheta] — vtheta scaled for max_angular: 25
    min_velocity: [-0.15, 0.0, -2.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "/odometry/filtered"  # EKF-fused odom — better than raw /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# smoother_server: optional path smoother
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# Global costmap
# Used by the path planner.  Covers the full map.
# Static layer:   known walls from the pgm map.
# Obstacle layer: live lidar readings from /scan.
# Inflation layer: pads all obstacles outward by inflation_radius.
#
# Key params to tune
#  footprint           445mm × 390mm box centred on base_link (see Quick-tune checklist)
#  inflation_radius    0.08  clearance added outside the polygon edge (max 0.105m for 600mm gaps)
#  cost_scaling_factor 1.0   gentle gradient — better for narrow court corridors
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0       # Hz — global map update rate (low = less CPU)
      publish_frequency: 1.0      # Hz — how often to send to RViz
      global_frame: map
      robot_base_frame: base_link

      # Robot footprint
      # Rectangular polygon matching the real robot: 445mm long × 390mm wide.
      # Corners listed clockwise from front-right (x=forward, y=left in ROS).
      footprint: "[[0.2225, 0.195], [0.2225, -0.195], [-0.2225, -0.195], [-0.2225, 0.195]]"

      resolution: 0.03             # metres per cell — matches the saved map
      track_unknown_space: true    # plan around unknown cells (treat as obstacle)
      always_send_full_costmap: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan                  # use raw /scan — need obstacles during motion
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5       # ← tune: max range at which to mark obstacles
          obstacle_min_range: 0.15      # ignore returns closer than 15cm — filters chassis reflections

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0        # was 3.0 — gentler gradient lets planner use more of narrow corridor
                                        # 3.0 = costs drop steeply, planner hugs wall midpoints aggressively
                                        # 1.0 = costs drop gently, more usable space in tight passages
        inflation_radius: 0.08          # ← TUNE: metres — clearance outside robot polygon edge
                                        # Constraint: gap_width/2 − robot_half_width = (0.6/2 − 0.195) = 0.105m max
                                        # 0.08 gives 25mm planning margin inside 600mm gaps
                                        # Too small: robot clips walls
                                        # Too large: robot refuses to enter narrow gaps

# Local costmap
# Rolling window around the robot.  Used by the controller for immediate collision
# avoidance and path following.  No static layer — only live lidar.
#
# Width/height should be at least 2× your lookahead_dist so the controller can
# always see far enough ahead.  3m default is comfortable.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0        # Hz — Pi can handle 5 Hz for local costmap
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3                     # metres — rolling window size
      height: 3
      resolution: 0.03
      # Must match global_costmap footprint exactly.
      footprint: "[[0.2225, 0.195], [0.2225, -0.195], [-0.2225, -0.195], [-0.2225, 0.195]]"
      track_unknown_space: false
      transform_tolerance: 1.5         # scan pipeline adds ~400ms latency; needs >0.5s margin

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0        # ← must match global_costmap value (1.0)
        inflation_radius: 0.08          # ← MUST match global_costmap inflation_radius
                                        # Court openings are 600mm; robot is 390mm wide.
                                        # Free space = 300 - 195 = 105mm max.
                                        # 0.30 filled the entire corridor → robot blocked on every goal.
