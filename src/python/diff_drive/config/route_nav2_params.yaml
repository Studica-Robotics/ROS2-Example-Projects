# route_nav2_params.yaml
# Nav2 config for route-server navigation — used by route_navigation.launch.py.
#
# Differences from nav2_params.yaml:
#   - bt_navigator uses route_nav_bt.xml (ComputeAndTrackRoute tree)
#   - bt_navigator plugin_lib_names includes route BT nodes
#   - route_server section added
#   - RPP allow_reversing: true (route server uses directed edges — reversing helps)
#
# Build the graph first with:
#   ros2 run diff_drive_cpp graph_builder --ros-args -p save_path:=$HOME/maps/my_graph.geojson
# Then launch:
#   ros2 launch diff_drive_cpp route_navigation.launch.py \
#       map:=$HOME/maps/my_room.yaml graph:=$HOME/maps/my_graph.geojson

# AMCL
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    max_particles: 2000
    min_particles: 500
    update_min_d: 0.0
    update_min_a: 0.0
    resample_interval: 1
    transform_tolerance: 1.5
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 3.0
    laser_max_range: 12.0
    laser_min_range: 0.1
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: scan
    map_topic: map
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    tf_broadcast: true
    save_pose_rate: 0.5
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

# map_server
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""    # set by route_navigation.launch.py via --ros-args

# bt_navigator
# Uses the route_nav_bt.xml tree (ComputeAndTrackRoute) instead of the default
# free-planning tree.  Plugin list extended with route BT nodes.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 50
    default_server_timeout: 120
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    # Custom BT — route tracking instead of free NavFn planning.
    # Path set by route_navigation.launch.py at runtime.
    default_nav_to_pose_bt_xml: ""    # overridden by launch argument bt_xml

    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

    # Standard nav2 BT nodes + route server BT nodes
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_route_bt_node
      - nav2_compute_and_track_route_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_assisted_teleop_action_bt_node

# planner_server
# NavFn is still loaded as a fallback; the route_server generates the path in
# normal operation via the BT ComputeAndTrackRoute node.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# controller_server
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 8.0
    transform_tolerance: 1.5

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1    # smaller — route nav makes slow, precise progress
      movement_time_allowance: 15.0
      required_movement_angle: 0.2     # ~11° rotation also counts as progress (for in-place turns)

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10          # tighter than free-nav (0.25) — route nodes are precise
      yaw_goal_tolerance: 3.14159      # heading-agnostic: arrive at XY, application layer owns post-arrival heading
      stateful: true

    FollowPath:
      # RotationShimController wraps RPP.
      # RSC rotates in place at corners (when heading error > angular_dist_threshold).
      # Once aligned it hands to RPP for straight-line path following.
      # RPP's use_rotate_to_heading handles final-goal heading alignment.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.3      # ~17° — rotate in place at any significant corner
      forward_sampling_distance: 0.15  # sample close to the corner so RSC triggers near the node, not 0.2m early
      rotate_to_heading_angular_vel: 3.0   # rad/s — 3.0/max_angular(25) = 12% duty; above Titan deadband
      max_angular_accel: 10.0          # high so first RPP step exceeds Titan deadband (see troubleshooting log)
      simulate_ahead_time: 1.0
      # RPP params (apply once RSC hands off)
      desired_linear_vel: 0.12         # match regular nav2 — known safe speed on this robot
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      lookahead_dist: 0.2
      min_lookahead_dist: 0.10
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true      # RPP rotates in place at final goal
      rotate_to_heading_min_angle: 0.4
      # allow_reversing is mutually exclusive with use_rotate_to_heading — leave false
      allow_reversing: false
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05   # must be < desired_linear_vel (was 0.25 > 0.20 — broken)
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: false   # disabled: route edges hug walls → inflation causes immediate false positives
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      transform_tolerance: 1.5
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

# behavior_server
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

# waypoint_follower
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# velocity_smoother
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    # OPEN_LOOP: ramps from prev_cmd_vel (not actual odom).
    # CLOSED_LOOP got stuck: first angular step = 2.0*0.05s = 0.1 rad/s = 0.4% duty,
    # below Titan deadband → robot never turns → odom stays 0 → stuck at 0.1 rad/s forever.
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 4.0]    # angular 4.0 = 16% duty — faster corners
    min_velocity: [-0.15, 0.0, -2.0]
    max_accel: [1.5, 0.0, 10.0]   # angular 10.0: first smoother step = 10*0.05s = 0.5 rad/s = 2% duty → above Titan deadband
    max_decel: [-1.5, 0.0, -10.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# smoother_server
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# Global costmap
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.2225, 0.195], [0.2225, -0.195], [-0.2225, -0.195], [-0.2225, 0.195]]"
      resolution: 0.03
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.06

# Local costmap
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03
      footprint: "[[0.2225, 0.195], [0.2225, -0.195], [-0.2225, -0.195], [-0.2225, 0.195]]"
      track_unknown_space: false
      transform_tolerance: 1.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        subscribe_to_updates: false
        map_subscribe_transient_local: true
        transform_tolerance: 1.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.06

# route_server
# Replaces free-space planning with a predefined waypoint graph.
# Graph file is a GeoJSON produced by graph_builder_node.
# Path set by route_navigation.launch.py at runtime via graph: argument.
route_server:
  ros__parameters:
    use_sim_time: false
    base_frame: "base_link"
    route_frame: "map"
    path_density: 0.03                 # metres between points on the dense path sent to RPP
    max_iterations: 0                  # 0 = unlimited
    max_planning_time: 2.0             # seconds
    smooth_corners: false              # no smoothing — preserve tight corridor geometry
    smoothing_radius: 1.0
    costmap_topic: "global_costmap/costmap_raw"
    transform_tolerance: 0.5
    graph_file_loader:
      plugin: "nav2_route::GeoJsonGraphFileLoader"
    graph_filepath: ""                 # overridden by route_navigation.launch.py via graph: argument

    # Edge scoring: prefer short routes; dynamic edges allow costmap-aware rerouting
    edge_cost_functions: ["DistanceScorer", "CostmapScorer", "DynamicEdgesScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"
      costmap_topic: "global_costmap/costmap_raw"
      max_cost: 252.0
      use_maximum: true
      invalid_on_collision: true
      invalid_off_map: true
      check_resolution: 1
    DynamicEdgesScorer:
      plugin: "nav2_route::DynamicEdgesScorer"

    # Route operations
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      costmap_topic: "global_costmap/costmap_raw"
      rate: 5.0
      max_cost: 252.0
      max_collision_dist: 1.3
      reroute_on_collision: true
      check_resolution: 1

    tracker_update_rate: 10.0
    aggregate_blocked_ids: true
    boundary_radius_to_achieve_node: 0.05   # small so controller's goal checker (xy+yaw) fires before route server declares done
    radius_to_achieve_node: 0.35            # ← tune: increase if robot overshoots mid-route nodes
    max_prune_dist_from_edge: 8.0
    min_prune_dist_from_goal: 0.15
    min_prune_dist_from_start: 0.10
    prune_goal: true
    enable_nn_search: false
    max_nn_search_iterations: 10000
    num_nearest_nodes: 8
